let promotionQueue=[],promotionEvent=null,promotionLine=0,promotionReturn='map';
function pendingPromotions(){const seen=campaign.promotionSeen||{};const out=[];for(const c of ALL_CHARACTERS[faction])if(mechaAvailable(c)){const earned=promotionRank(c.id),done=clamp(Math.floor(Number(seen[c.id])||1),1,5);for(let rank=done+1;rank<=earned;rank++)out.push({id:c.id,rank});}return out;}
function beginPromotions(){const pending=pendingPromotions();if(!pending.length)return false;promotionReturn=state==='won'?'won':'map';promotionQueue=pending;promotionEvent=promotionQueue.shift();promotionLine=0;state='promotion';paused=false;keys={};release();menuHits=[];syncMusic();return true;}
function finishPromotion(){if(!promotionEvent)return;campaign.promotionSeen??={};campaign.promotionSeen[promotionEvent.id]=Math.max(Number(campaign.promotionSeen[promotionEvent.id])||1,promotionEvent.rank);persistCampaign();promotionEvent=promotionQueue.shift()||null;promotionLine=0;menuHits=[];if(!promotionEvent){state=promotionReturn;syncMusic();}}
function nextPromotionLine(){if(!promotionEvent)return;const lines=promotionDialogue(promotionEvent);if(++promotionLine>=lines.length)finishPromotion();}

 fit('ui_header',W/2,47,W*.68,95);boundedLabel(PROMOTION_TITLES[e.rank-1],W/2,46,W*.44,33,26,uiTheme().bright);boundedLabel('|'.repeat(e.rank)+' '+c.name+' · 장비칸 '+e.rank+'개 개방',W/2,99,W*.70,27,21,uiTheme().bright);
 g.save();g.globalAlpha=d.royal?1:.76;fit('royal_'+faction,W*.24,319,W*.32,440);g.restore();g.save();g.globalAlpha=d.royal?.76:1;fit('portrait_'+e.id,W*.76,322,W*.32,434);g.restore();
 label(royal,W*.24,488,20,uiTheme().bright);boundedLabel('|'.repeat(e.rank)+' '+c.name,W*.76,488,W*.36,30,20,uiTheme().bright);g.fillStyle=faction==='F'?'#240d20e8':'#10131ee8';g.fillRect(28,514,W-56,181);rule(44,514,W-88);label(d.speaker,59,543,21,uiTheme().bright,'left');wrapLabel(d.text,W/2,581,W-146,23,'#fff',3);label((promotionLine+1)+' / '+promotionDialogue(e).length,W-59,541,14,uiTheme().muted,'right');
 menuButton('이전',40,642,112,42,()=>{promotionLine=Math.max(0,promotionLine-1);},promotionLine>0);menuButton('대화 넘기기',W-375,642,164,42,finishPromotion);menuButton(promotionLine===promotionDialogue(e).length-1?'승급 확인':'다음  →',W-195,642,150,42,nextPromotionLine);menuHits.push({x:175,y:553,w:W-350,h:79,fn:nextPromotionLine});}
const draw16=draw;draw=function(){if(state==='promotion')drawPromotion();else draw16();};
const tap16=handleCampaignTap;handleCampaignTap=function(p){if(state==='promotion'){for(const h of menuHits)if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();break;}return true;}return tap16(p);};
const overlay16=overlay;overlay=function(){overlay16();if(state==='won'){const pending=pendingPromotions();if(pending.length)menuButton('황실 알현 · 승급 '+pending.length+'건',W*.09,154,W*.48,48,beginPromotions);}};
const update16=update;update=function(dt){if(state==='map'&&loaded&&!portalSleeping&&pendingPromotions().length)beginPromotions();update16(dt);};
const goMap16=goMap;goMap=function(){if(state==='won'&&beginPromotions())return;goMap16();};
const deploy16=openDeploy;openDeploy=function(n){if(state==='won'&&beginPromotions())return;deploy16(n);};
