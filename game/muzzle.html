<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

", "q": "kneel", "src": "h_morc_kneel.webp", "d": [425, 69]}, {"t": "h", "k": "melf", "q": "stand", "src": "h_melf_stand.webp", "d": [543, 87]}, {"t": "h", "k": "melf", "q": "kneel", "src": "h_melf_kneel.webp", "d": [517, 77]}, {"t": "h", "k": "mlizard", "q": "stand", "src": "h_mlizard_stand.webp", "d": [519, 88]}, {"t": "h", "k": "mlizard", "q": "kneel", "src": "h_mlizard_kneel.webp", "d": [529, 80]}, {"t": "h", "k": "mmedic", "q": "stand", "src": "h_mmedic_stand.webp", "d": [444, 73]}, {"t": "h", "k": "mmedic", "q": "kneel", "src": "h_mmedic_kneel.webp", "d": [415, 83]}, {"t": "h", "k": "mgoblin", "q": "stand", "src": "h_mgoblin_stand.webp", "d": [444, 106]}, {"t": "h", "k": "mgoblin", "q": "kneel", "src": "h_mgoblin_kneel.webp", "d": [460, 101]}, {"t": "e", "k": "kn_kneel1", "src": "e_kn_kneel1.png", "d": null}, {"t": "e", "k": "kn_kneel2", "src": "e_kn_kneel2.png", "d": null}, {"t": "e", "k": "kn_stand1", "src": "e_kn_stand1.png", "d": null}, {"t": "e", "k": "kn_stand2", "src": "e_kn_stand2.png", "d": null}, {"t": "e", "k": "mech_golem", "src": "e_mech_golem.png", "d": null}, {"t": "e", "k": "mech_golem2", "src": "e_mech_golem2.png", "d": null}, {"t": "e", "k": "mech_gun", "src": "e_mech_gun.png", "d": null}, {"t": "e", "k": "mech_shield", "src": "e_mech_shield.png", "d": null}, {"t": "e", "k": "mech_spider", "src": "e_mech_spider.png", "d": null}, {"t": "e", "k": "wk_kneel1", "src": "e_wk_kneel1.png", "d": null}, {"t": "e", "k": "wk_kneel2", "src": "e_wk_kneel2.png", "d": null}, {"t": "e", "k": "wk_stand1", "src": "e_wk_stand1.png", "d": null}, {"t": "e", "k": "wk_stand2", "src": "e_wk_stand2.png", "d": null}, {"t": "e", "k": "wm_golem", "src": "e_wm_golem.png", "d": null}, {"t": "e", "k": "wm_golem2", "src": "e_wm_golem2.png", "d": null}, {"t": "e", "k": "wm_gun", "src": "e_wm_gun.png", "d": null}, {"t": "e", "k": "wm_spider", "src": "e_wm_spider.png", "d": null}, {"t": "e", "k": "wm_wing", "src": "e_wm_wing.png", "d": null}, {"t": "e", "k": "kn_fire", "src": let P={};try{P=JSON.parse(localStorage.getItem('gw_muz')||'{}')}catch(e){}
const key=i=>IT[i].t+':'+IT[i].k+':'+(IT[i].q||'');
let i=0;try{i=Math.min(IT.length-1,+localStorage.getItem('gw_muz_i')||0)}catch(e){}
const cv=document.getElementById('cv'),g=cv.getContext('2d'),IM={};
function img(s){if(!IM[s]){const m=new Image();m.onload=draw;m.src=s;IM[s]=m}return IM[s]}
let fit={};
function pt(){return P[key(i)]||IT[i].d}
function draw(){const W=innerWidth,H=innerHeight-52-74;cv.width=W;cv.height=H;g.fillStyle='#2a2230';g.fillRect(0,0,W,H);
 const it=IT[i],m=img(it.src);document.getElementById('ttl').innerHTML=(it.t=='h'?'영웅 <b>'+it.k+'</b> · '+(it.q=='stand'?'서서 쏘기':'웅크려 쏘기'):'적 <b>'+it.k+'</b>')+' ('+(i+1)+'/'+IT.length+')';
 if(!m.complete||!m.naturalWidth)return;const k=Math.min((W-20)/m.naturalWidth,(H-20)/m.naturalHeight),w=m.naturalWidth*k,h=m.naturalHeight*k,x=(W-w)/2,y=(H-h)/2;fit={k,x,y};
 for(let yy=0;yy<h;yy+=16)for(let xx=0;xx<w;xx+=16){g.fillStyle=((xx+yy)/16)%2?'#3a3240':'#332b38';g.fillRect(x+xx,y+yy,16,16)}
 g.drawImage(m,x,y,w,h);const p=pt();if(!p)return;const px=x+p[0]*k,py=y+p[1]*k;
 g.strokeStyle=P[key(i)]?'#3f6':'#ff0';g.lineWidth=2;g.beginPath();g.moveTo(px-18,py);g.lineTo(px+18,py);g.moveTo(px,py-18);g.lineTo(px,py+18);g.stroke();g.beginPath();g.arc(px,py,7,0,7);g.stroke();
 const Z=4,R=70,zx=W-R-12,zy=R+12;g.save();g.beginPath();g.arc(zx,zy,R,0,7);g.clip();g.fillStyle='#2a2230';g.fillRect(zx-R,zy-R,2*R,2*R);
 g.imageSmoothingEnabled=false;g.drawImage(m,p[0]-R/Z,p[1]-R/Z,2*R/Z,2*R/Z,zx-R,zy-R,2*R,2*R);g.restore();
 g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(zx,zy,R,0,7);g.stroke();g.strokeStyle='#f33';g.beginPath();g.moveTo(zx-10,zy);g.lineTo(zx+10,zy);g.moveTo(zx,zy-10);g.lineTo(zx,zy+10);g.stroke()}
function save(){try{localStorage.setItem('gw_muz',JSON.stringify(P));localStorage.setItem('gw_muz_i',i)}catch(e){}}
function setAt(cx,cy){const r=cv.getBoundingClientRect(),m=img(IT[i].src);if(!fit.k)return;let x=Math.round((cx-r.left-fit.x)/fit.k),y=Math.round((cy-r.top-fit.y)/fit.k);
 x=Math.max(0,Math.min(m.naturalWidth-1,x));y=Math.max(0,Math.min(m.naturalHeight-1,y));P[key(i)]=[x,y];save();draw()}
let drag=false;cv.addEventListener('pointerdown',e=>{drag=true;setAt(e.clientX,e.clientY)});cv.addEventListener('pointermove',e=>{if(drag)setAt(e.clientX,e.clientY)});addEventListener('pointerup',()=>drag=false);
addEventListener('keydown',e=>{const p=pt();if(!p)return;const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){P[key(i)]=[p[0]+d[0],p[1]+d[1]];save();draw();e.preventDefault()}if(e.key=='Enter')nx()});
function out(){const o={h:{},e:{}};IT.forEach((it,j)=>{const p=P[key(j)]||it.d;if(!p)return;if(it.t=='h'){(o.h[it.k]=o.h[it.k]||{})[it.q]=p}else if(P[key(j)])o.e[it.k]=p});
 document.getElementById('ta').value='MUZ='+JSON.stringify(o);document.getElementById('out').style.display='flex'}
function nx(){if(i<IT.length-1){i++;save();draw()}else out()}
document.getElementById('nx').onclick=nx;document.getElementById('pv').onclick=()=>{if(i>0){i--;save();draw()}};
document.getElementById('back').onclick=()=>{document.getElementById('out').style.display='none'};
document.getElementById('cp').onclick=()=>{const t=document.getElementById('ta');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}document.getElementById('cp').textContent='복사됨'};
addEventListener('resize',draw);draw();
