function drawVisibleMuzzleFlashes(){
 for(const f of flashes){
  const q=Math.max(0,1-f.t/f.life),fade=Math.min(1,q*2.2),ss=0.72+0.28*Math.pow(q,.7);
  const im=f.sprite?uiImg(f.sprite):null;
  if(im&&im.ok){
   const base=(f.kind==='저격'?124:(f.kind==='산탄'?112:(f.kind==='enemy'?102:(f.kind==='mech'?138:(f.kind==='drone'?84:94)))))*f.s*ss;
   const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
   const scale=base/Math.max(iw,ih),dw=iw*scale,dh=ih*scale;
   const ox=Math.cos(f.a)*(f.kind==='저격'?14:10)*f.s,oy=Math.sin(f.a)*(f.kind==='저격'?10:7)*f.s;
   g.save();
   g.translate(f.x+ox,f.y+oy);
   g.rotate(f.rot||0);
   g.globalCompositeOperation='lighter';
   g.globalAlpha=fade*(f.ally?(f.manual?0.95:0.82):0.88);
   g.drawImage(im,-dw/2,-dh/2,dw,dh);
   g.restore();
   continue;
  }
  const len=(f.ally?49:44)*f.s*ss,wide=(f.ally?15:17)*f.s*ss;
  if(len<0.5)continue;
  g.save();g.translate(f.x,f.y);g.rotate(f.a);g.globalCompositeOperation='lighter';g.globalAlpha=fade;
  const glow=g.createRadialGradient(0,0,0,0,0,wide*2.6);glow.addColorStop(0,'rgba(255,247,198,.92)');glow.addColorStop(.24,'rgba(255,174,70,.6)');glow.addColorStop(1,'rgba(255,83,25,0)');
  g.fillStyle=glow;g.fillRect(-wide*2.6,-wide*2.6,wide*5.2,wide*5.2);
  const core=g.createLinearGradient(0,0,len,0);core.addColorStop(0,'rgba(255,255,244,1)');core.addColorStop(.28,'rgba(255,235,134,1)');core.addColorStop(.7,'rgba(255,135,47,.88)');core.addColorStop(1,'rgba(255,71,15,0)');
  g.fillStyle=core;g.beginPath();g.moveTo(-wide*.2,-wide*.43);g.lineTo(len*.17,-wide*.38);g.lineTo(len,0);g.lineTo(len*.17,wide*.38);g.lineTo(-wide*.2,wide*.43);g.closePath();g.fill();
  g.fillStyle='rgba(255,252,229,.98)';g.beginPath();g.ellipse(0,0,wide*.50,wide*.32,0,0,7);g.fill();
  g.restore();
 }
}
function draw(){
 if(menu){drawMenu();drawFS();return}
 const cx=cross.x-camX,cy=cross.y;
 scope+=(((fireHeld||window.GW_SKILL_SNIPER)&&!over?1:0)-scope)*0.2;
 const R=(portrait?200:170)*0.75*heroes[sel].w.r;let ringR=26;
 // 화면 흔들림: 평소엔 천천히 출렁, 사격·피격 때 크게 떨림
 // 조준점(화면에 보이는 위치): 흔들리지 않고 고정. 배경 확대 비율만 맞춰 둔다
 const zsB=1.14,vx=W/2+(cx-W/2)*zsB,vy=H/2+(cy-H/2)*zsB;
 const ox=Math.sin(t/70)*14+Math.sin(t/31)*4+(Math.random()-0.5)*shk*4.5,oy=Math.sin(t/53)*11+Math.sin(t/25)*3+(Math.random()-0.5)*shk*4.5;
 const rt=Math.sin(t/120)*0.01+(Math.random()-0.5)*shk*0.003,zs=zsB+Math.sin(t/100)*0.02+zp;
 const shakeT=f=>{g.translate(W/2+ox*f,H/2+oy*f);g.rotate(rt*f);g.scale(zs,zs);g.translate(-W/2,-H/2)};
 // 전투 월드는 조준 여부와 무관하게 메인 캔버스에 딱 한 번만 렌더링한다.
 // 예전의 전체화면 보조 버퍼 + 4회 축소/확대 블러 과정 제거.
 g.save();shakeT(scope<0.01?1:1-0.5*scope);
 g.translate(-Math.round(camX),0);drawWorld();g.restore();
 if(scope>=0.01){
  const z2=1+heroes[sel].w.zoom*scope;
  ringR=26+(R-26)*scope;
  // 방금 그린 화면의 스코프 주변 작은 직사각형만 원 안에 확대 복사한다.
  // 화면 가장자리의 소스 좌표를 잘라 drawImage 범위 오류를 방지한다.
  const radius=ringR+32,srcR=radius/z2;
  const sx=Math.max(0,vx-srcR),sy=Math.max(0,vy-srcR);
  const ex=Math.min(W,vx+srcR),ey2=Math.min(H,vy+srcR);
  if(ex>sx&&ey2>sy){
   g.save();g.beginPath();g.arc(vx,vy,ringR,0,Math.PI*2);g.clip();
   g.drawImage(cv,sx,sy,ex-sx,ey2-sy,
     vx-radius+(sx-vx+srcR)*z2,vy-radius+(sy-vy+srcR)*z2,
     (ex-sx)*z2,(ey2-sy)*z2);
   g.restore();
  }
  // 블러 대신 조준경 바깥만 검정 45%로 가볍게 가린다.
  g.save();g.fillStyle='rgba(0,0,0,'+(0.45*scope)+')';
  g.beginPath();g.rect(0,0,W,H);g.arc(vx,vy,ringR,0,Math.PI*2,true);
  g.fill('evenodd');g.restore();
